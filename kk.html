<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>To Do List</title>
    <link rel="stylesheet" href="to_do_list.css">
</head>
<body>

    <div class="todo-card">
        <h1>To Do List</h1>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Введите задачу">
            <button id="addBtn">Add</button>
        </div>
    </div>    
    <div class="taskList">
        <h2>Task List</h2>
        <div class="only_tasks">

        </div>
    </div>
    <div>
        <p>
            completed:<span id="completed"></span>
        </p>
        <p>
            uncompleted:<span id="uncompleted"></span>
        </p>
    </div> 

    

    <script src="to_do_list.js"></script>
</body>
</html>
